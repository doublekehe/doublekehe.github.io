<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">传统级联推荐与 OneRec 端到端生成对比</title>
  <desc id="desc">左侧展示候选集经过召回、粗排、精排、重排逐级缩小；右侧展示用户上下文经 Itemic Tokenizer 和统一生成模型直接生成推荐 Session，并利用曝光反馈完成偏好对齐。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#263548}
      .panel-title{font-size:31px;font-weight:700}.kicker{font-size:17px;font-weight:700;letter-spacing:1.6px}.label{font-size:22px;font-weight:650}.body{font-size:18px}.small{font-size:16px;fill:#65758A}.tiny{font-size:14px;fill:#718096}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;font-weight:650}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5 0 7Z" fill="#718198"/></marker>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5 0 7Z" fill="#527DC5"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#233B59" flood-opacity=".08"/></filter>
    <linearGradient id="modelFill" x1="0" x2="1"><stop stop-color="#EEF5FF"/><stop offset="1" stop-color="#F5F0FF"/></linearGradient>
  </defs>
  <rect width="1600" height="920" fill="#F7F9FC"/>

  <!-- panel shells -->
  <g filter="url(#shadow)"><rect x="54" y="48" width="718" height="824" rx="20" fill="#FFF"/><rect x="796" y="48" width="750" height="824" rx="20" fill="#FFF"/></g>
  <rect x="54" y="48" width="718" height="76" rx="20" fill="#F0F3F7"/><path d="M54 103H772V124H54Z" fill="#F0F3F7"/>
  <rect x="796" y="48" width="750" height="76" rx="20" fill="#EAF2FF"/><path d="M796 103H1546V124H796Z" fill="#EAF2FF"/>
  <circle cx="92" cy="86" r="16" fill="#7F8EA3"/><text x="92" y="92" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">A</text>
  <text x="122" y="82" class="panel-title">多阶段级联：逐级筛选候选</text><text x="122" y="108" class="small">point-wise scoring · locally optimized</text>
  <circle cx="834" cy="86" r="16" fill="#4F7FD2"/><text x="834" y="92" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">B</text>
  <text x="864" y="82" class="panel-title">OneRec：直接生成推荐 Session</text><text x="864" y="108" class="small">autoregressive generation · list-level alignment</text>

  <!-- left: shrinking funnel -->
  <text x="92" y="166" class="kicker" fill="#718096">ONLINE INFERENCE</text>
  <g>
    <rect x="88" y="193" width="650" height="84" rx="14" fill="#F7F9FB" stroke="#C7D0DB" stroke-width="1.5"/>
    <g fill="#B9C4D1"><rect x="109" y="213" width="35" height="18" rx="4"/><rect x="151" y="213" width="35" height="18" rx="4"/><rect x="193" y="213" width="35" height="18" rx="4"/><rect x="235" y="213" width="35" height="18" rx="4"/><rect x="277" y="213" width="35" height="18" rx="4"/><rect x="319" y="213" width="35" height="18" rx="4"/><rect x="361" y="213" width="35" height="18" rx="4"/><rect x="403" y="213" width="35" height="18" rx="4"/></g>
    <text x="109" y="258" class="label">海量物品库</text><text x="708" y="251" text-anchor="end" class="mono" fill="#607080">10⁶–10⁹ items</text>
  </g>
  <path d="M413 277V308" stroke="#718198" stroke-width="2.2" marker-end="url(#arrow)"/>
  <g>
    <rect x="104" y="318" width="618" height="82" rx="14" fill="#EAF3FF" stroke="#7FA2D9" stroke-width="1.6"/><text x="134" y="351" class="label">召回 Retrieval</text><text x="134" y="379" class="small">双塔 / ANN / 规则通道</text>
    <g fill="#7FA2D9"><circle cx="594" cy="356" r="6"/><circle cx="617" cy="356" r="6"/><circle cx="640" cy="356" r="6"/><circle cx="663" cy="356" r="6"/><circle cx="686" cy="356" r="6"/></g><text x="699" y="383" text-anchor="end" class="mono">10³</text>
  </g>
  <path d="M413 400V431" stroke="#718198" stroke-width="2.2" marker-end="url(#arrow)"/>
  <g>
    <rect x="136" y="441" width="554" height="82" rx="14" fill="#EEF7EB" stroke="#8AB574" stroke-width="1.6"/><text x="166" y="474" class="label">粗排 Pre-rank</text><text x="166" y="502" class="small">轻量模型 · 低延迟筛选</text><text x="666" y="491" text-anchor="end" class="mono">10²</text>
  </g>
  <path d="M413 523V554" stroke="#718198" stroke-width="2.2" marker-end="url(#arrow)"/>
  <g>
    <rect x="171" y="564" width="484" height="82" rx="14" fill="#FFF2E8" stroke="#E49B63" stroke-width="1.6"/><text x="201" y="597" class="label">精排 Rank</text><text x="201" y="625" class="small">CTR / WatchTime / 多目标融合</text><text x="630" y="614" text-anchor="end" class="mono">10¹</text>
  </g>
  <path d="M413 646V677" stroke="#718198" stroke-width="2.2" marker-end="url(#arrow)"/>
  <g>
    <rect x="208" y="687" width="410" height="74" rx="14" fill="#F3EDFC" stroke="#9D83C8" stroke-width="1.6"/><text x="238" y="718" class="label">重排 Re-rank</text><text x="238" y="744" class="small">多样性 · 业务约束</text>
  </g>
  <rect x="178" y="794" width="470" height="48" rx="24" fill="#F4F6F8" stroke="#D3DAE2"/><text x="413" y="824" text-anchor="middle" class="body" fill="#5E6B7C">多套目标 / 特征 / 模型 / 服务链路</text>
  <path d="M187 298H92V763H187" fill="none" stroke="#AAB5C1" stroke-width="1.6" stroke-dasharray="5 6"/><text x="79" y="540" text-anchor="middle" class="tiny" transform="rotate(-90 79 540)">stage-wise optimization</text>

  <!-- right: unified generation -->
  <text x="834" y="166" class="kicker" fill="#527DC5">UNIFIED GENERATIVE PIPELINE</text>
  <g>
    <rect x="833" y="194" width="174" height="116" rx="14" fill="#F4F7FB" stroke="#AAB7C7" stroke-width="1.5"/>
    <text x="920" y="222" text-anchor="middle" class="label">用户上下文</text>
    <g fill="#DCE4ED" stroke="#95A5B7"><circle cx="864" cy="255" r="13"/><rect x="887" y="242" width="87" height="11" rx="5"/><rect x="887" y="261" width="65" height="9" rx="4"/><rect x="851" y="279" width="137" height="11" rx="5"/></g>
    <text x="920" y="333" text-anchor="middle" class="small">画像 · 行为 · 场景</text>
  </g>
  <path d="M1007 252H1050" stroke="#527DC5" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <g>
    <rect x="1062" y="194" width="226" height="116" rx="14" fill="#EFF8EC" stroke="#83AF70" stroke-width="1.5"/>
    <text x="1175" y="222" text-anchor="middle" class="label">Itemic Tokenizer</text>
    <g><rect x="1088" y="242" width="48" height="38" rx="8" fill="#FFF" stroke="#79A864"/><rect x="1144" y="242" width="48" height="38" rx="8" fill="#FFF" stroke="#79A864"/><rect x="1200" y="242" width="48" height="38" rx="8" fill="#FFF" stroke="#79A864"/><text x="1112" y="267" text-anchor="middle" class="mono">a₉</text><text x="1168" y="267" text-anchor="middle" class="mono">b₇</text><text x="1224" y="267" text-anchor="middle" class="mono">c₁</text></g>
    <text x="1175" y="333" text-anchor="middle" class="small">semantic / collaborative codes</text>
  </g>
  <path d="M1175 310V352" stroke="#527DC5" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="902" y="365" width="545" height="240" rx="20" fill="url(#modelFill)" stroke="#668CCD" stroke-width="2"/>
    <rect x="924" y="389" width="501" height="43" rx="10" fill="#DDEAFF"/><text x="1175" y="417" text-anchor="middle" class="label">统一生成 Backbone</text>
    <rect x="935" y="457" width="143" height="102" rx="12" fill="#FFF" stroke="#9AB2D4"/><text x="1006" y="489" text-anchor="middle" class="body" font-weight="650">Context</text><text x="1006" y="516" text-anchor="middle" class="small">Encoder /</text><text x="1006" y="538" text-anchor="middle" class="small">Processor</text>
    <path d="M1078 508H1123" stroke="#718198" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="1135" y="457" width="182" height="102" rx="12" fill="#FFF" stroke="#9D87C5"/><text x="1226" y="489" text-anchor="middle" class="body" font-weight="650">Autoregressive</text><text x="1226" y="517" text-anchor="middle" class="small">Decoder / LLM</text><text x="1226" y="541" text-anchor="middle" class="small">Sparse MoE</text>
    <path d="M1317 508H1360" stroke="#718198" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g fill="#F9FBFD" stroke="#A9B5C4"><rect x="1371" y="470" width="35" height="31" rx="6"/><rect x="1371" y="511" width="35" height="31" rx="6"/></g><text x="1388" y="490" text-anchor="middle" class="tiny">y<tspan baseline-shift="sub" font-size="10">t</tspan></text><text x="1388" y="531" text-anchor="middle" class="tiny">y<tspan baseline-shift="sub" font-size="10">t+1</tspan></text>
  </g>
  <rect x="918" y="628" width="151" height="38" rx="19" fill="#E8F0FE"/><text x="994" y="653" text-anchor="middle" class="small" font-weight="700">NTP / SFT</text>
  <rect x="1082" y="628" width="162" height="38" rx="19" fill="#F2EAFD"/><text x="1163" y="653" text-anchor="middle" class="small" font-weight="700">DPO / GRPO</text>
  <rect x="1257" y="628" width="167" height="38" rx="19" fill="#FFF0E5"/><text x="1341" y="653" text-anchor="middle" class="small" font-weight="700">Real Feedback</text>

  <path d="M1175 605V702" stroke="#527DC5" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <g>
    <text x="832" y="729" class="kicker" fill="#527DC5">GENERATED SESSION</text>
    <g filter="url(#shadow)"><rect x="832" y="747" width="594" height="82" rx="16" fill="#FFF" stroke="#AEB9C7"/></g>
    <g fill="#F4EDFF" stroke="#987CC3" stroke-width="1.5"><rect x="858" y="768" width="74" height="41" rx="9"/><rect x="944" y="768" width="74" height="41" rx="9"/><rect x="1030" y="768" width="74" height="41" rx="9"/><rect x="1116" y="768" width="74" height="41" rx="9"/><rect x="1202" y="768" width="74" height="41" rx="9"/><rect x="1288" y="768" width="112" height="41" rx="9"/></g>
    <text x="895" y="794" text-anchor="middle" class="mono">item 1</text><text x="981" y="794" text-anchor="middle" class="mono">item 2</text><text x="1067" y="794" text-anchor="middle" class="mono">item 3</text><text x="1153" y="794" text-anchor="middle" class="mono">item 4</text><text x="1239" y="794" text-anchor="middle" class="mono">item 5</text><text x="1344" y="794" text-anchor="middle" class="mono">… item K</text>
  </g>
  <path d="M1426 789H1492V494H1452" fill="none" stroke="#D5824A" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="1504" y="645" text-anchor="middle" class="tiny" transform="rotate(-90 1504 645)" fill="#B66B3C">exposure → behavior → reward</text>
</svg>
