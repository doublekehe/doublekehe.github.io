<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>李宏毅老师的 AI 课程学习指南</title>
  <meta name="description" content="从数学、机器学习到大模型与 Agent 的可点击课程学习地图，附课件和视频链接。">
  <link rel="stylesheet" href="map.css">
  <script defer src="map.js"></script>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="eyebrow"><span class="brand-dot"></span> AI COURSE ATLAS <span class="edition">2026.11</span></div>
    <h1>李宏毅老师的 AI 课程学习指南</h1>
    <p class="intro">与博文表 2 对应的同一条学习路径，按单元逐步学习。</p>
    <div class="stats" id="stats" aria-label="课程数据统计"></div>
    <div class="progress-line"><span id="progressText">正在载入课程资料…</span><progress id="progress" value="0" max="102" aria-label="学习单元完成进度"></progress></div>
  </header>
  <main>
    <section class="controls" aria-label="查找学习内容">
      <div class="view-tabs" role="group" aria-label="查看方式">
        <button class="active" data-view="map" aria-pressed="true">路径地图</button>
        <button data-view="path" aria-pressed="false">路径表格</button>
        <button data-view="archive" aria-pressed="false">历年目录</button>
      </div>
      <div class="filters">
        <label class="search-label"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索主题、单元或课程，例如 KV Cache" aria-label="搜索课程与学习单元"></label>
        <label class="select-label"><span class="sr-only">学习方向</span><select id="route" aria-label="学习方向"><option value="all">全部方向</option><option value="core">基础与主线</option><option value="llm">大模型</option><option value="agent">Agent 应用</option><option value="multimodal">生成与多模态</option></select></label>
        <label class="select-label"><span class="sr-only">所属课程</span><select id="course" aria-label="所属课程"><option value="all">全部学期课程</option></select></label>
      </div>
      <div class="utility"><p id="resultStatus" role="status" aria-live="polite"></p><div><button id="exportProgress" class="text-button">导出学习记录</button><label class="text-button file-label">导入记录<input id="importProgress" type="file" accept="application/json,.json"></label><a href="learning-path.csv" download>下载 CSV ↗</a></div></div>
      <p id="recordNotice" class="notice" role="status"></p>
    </section>
    <p class="reading-hint" id="hint">与博文表 2 是同一条学习路径。按阶段向下，同阶段从左到右学习；点击单元查看前置知识和课程资料。</p>
    <div id="content"><p class="loading">正在载入课程与学习地图…</p></div>
    <noscript><p>交互地图需要 JavaScript。可以<a href="learning-path.csv">下载学习路径 CSV</a>，或返回博文阅读两张完整表格。</p></noscript>
  </main>
  <footer><p>学习顺序与完成标志为整理建议，资源以课程官网为准。如需在B站观看，可按“李宏毅＋课程名称＋年份”或具体讲次标题搜索。</p><p>记录仅保存在当前浏览器，可导出备份。<a href="historical-directory.md" download>下载历年资源目录 Markdown ↗</a></p><p><a href="https://speech.ee.ntu.edu.tw/~hylee/ml/2026-spring.php" target="_blank" rel="noopener noreferrer">李宏毅课程官网 ↗</a> · 核查日期 2026-11-01</p></footer>
</div>
<dialog id="details" aria-labelledby="detailTitle">
  <div class="dialog-bar"><span class="eyebrow">LEARNING NODE</span><button id="closeDetail" aria-label="关闭课程详情">✕</button></div>
  <div id="detailBody"></div>
</dialog>
</body>
</html>
