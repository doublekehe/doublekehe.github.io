<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">AutoEncoder 通用架构</title>
  <desc id="desc">输入经过编码器压缩为潜在表示，再由解码器重建输入。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill:#0f172a; }
      .title { font-size:28px;font-weight:700; } .cn { font-size:25px;font-weight:700; } .en { font-size:18px;font-weight:600;fill:#64748b; }
      .arrow { stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="#f8fafc"/>
  <text x="700" y="58" text-anchor="middle" class="title">AutoEncoder 通用架构</text>
  <g filter="url(#shadow)">
    <rect x="50" y="140" width="205" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="325" y="115" width="220" height="220" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="615" y="145" width="170" height="160" rx="20" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <rect x="855" y="115" width="220" height="220" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <rect x="1145" y="140" width="205" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="560" y="390" width="280" height="78" rx="17" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="152" y="202" text-anchor="middle" class="cn">输入</text><text x="152" y="243" text-anchor="middle" font-size="31" font-weight="700">X</text><text x="152" y="280" text-anchor="middle" class="en">Input</text>
  <text x="435" y="194" text-anchor="middle" class="cn">编码器</text><text x="435" y="235" text-anchor="middle" class="en">Encoder</text><text x="435" y="276" text-anchor="middle" font-size="18" fill="#64748b">提取并压缩特征</text>
  <text x="700" y="194" text-anchor="middle" class="cn">潜在表示</text><text x="700" y="239" text-anchor="middle" font-size="34" font-weight="700" fill="#6d28d9">Z</text><text x="700" y="278" text-anchor="middle" class="en">Bottleneck</text>
  <text x="965" y="194" text-anchor="middle" class="cn">解码器</text><text x="965" y="235" text-anchor="middle" class="en">Decoder</text><text x="965" y="276" text-anchor="middle" font-size="18" fill="#64748b">从特征重建输入</text>
  <text x="1247" y="202" text-anchor="middle" class="cn">重建结果</text><text x="1247" y="243" text-anchor="middle" font-size="31" font-weight="700">X̂</text><text x="1247" y="280" text-anchor="middle" class="en">Reconstruction</text>
  <text x="700" y="422" text-anchor="middle" font-size="21" font-weight="700">重建损失</text><text x="700" y="451" text-anchor="middle" class="en">比较 X 与 X̂</text>
  <path class="arrow" d="M255 225 H312"/><path class="arrow" d="M545 225 H602"/><path class="arrow" d="M785 225 H842"/><path class="arrow" d="M1075 225 H1132"/>
  <path d="M152 310 V365 Q152 390 177 390 H548" stroke="#94a3b8" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
  <path d="M1247 310 V365 Q1247 390 1222 390 H852" stroke="#94a3b8" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
</svg>
