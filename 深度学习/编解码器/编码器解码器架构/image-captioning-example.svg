<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">图片描述中的编码器-解码器流程</title>
  <desc id="desc">图像经视觉编码器转换为特征表示，文本解码器再生成图片描述。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; } .cn { font-size: 25px; font-weight: 700; }
      .en { font-size: 18px; font-weight: 600; fill: #64748b; } .token { font-size: 18px; font-weight: 650; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="#f8fafc"/>
  <text x="700" y="56" text-anchor="middle" class="title">图片描述：图像 → 文本序列</text>
  <g filter="url(#shadow)">
    <rect x="40" y="112" width="245" height="218" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="335" y="112" width="210" height="218" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="595" y="132" width="210" height="178" rx="20" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <rect x="855" y="112" width="210" height="218" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <rect x="1115" y="112" width="245" height="218" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="855" y="392" width="210" height="82" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="162" y="151" text-anchor="middle" class="cn">输入图像</text>
  <rect x="66" y="174" width="192" height="112" rx="12" fill="#dbeafe"/><circle cx="218" cy="198" r="13" fill="#fbbf24"/>
  <path d="M66 252 Q112 224 158 250 T258 242 V286 H66 Z" fill="#86efac"/>
  <ellipse cx="153" cy="238" rx="38" ry="22" fill="#c08457"/><circle cx="190" cy="224" r="20" fill="#c08457"/>
  <path d="M177 207 L181 187 L195 207 Z" fill="#8b5e3c"/><path d="M198 208 L209 190 L211 216 Z" fill="#8b5e3c"/><circle cx="197" cy="221" r="2.8" fill="#0f172a"/>
  <path d="M119 239 Q100 225 106 213" stroke="#8b5e3c" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M136 257 L132 272 M166 257 L170 272" stroke="#8b5e3c" stroke-width="7" stroke-linecap="round"/>
  <text x="162" y="313" text-anchor="middle" class="en">Image</text>
  <text x="440" y="190" text-anchor="middle" class="cn">视觉编码器</text><text x="440" y="229" text-anchor="middle" class="en">CNN / ViT</text><text x="440" y="270" text-anchor="middle" font-size="18" fill="#64748b">提取视觉特征</text>
  <text x="700" y="177" text-anchor="middle" class="cn">图像特征</text>
  <g fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"><rect x="642" y="204" width="27" height="27" rx="5"/><rect x="675" y="204" width="27" height="27" rx="5"/><rect x="708" y="204" width="27" height="27" rx="5"/><rect x="642" y="237" width="27" height="27" rx="5"/><rect x="675" y="237" width="27" height="27" rx="5"/><rect x="708" y="237" width="27" height="27" rx="5"/></g>
  <text x="765" y="244" text-anchor="middle" font-size="30" font-weight="700" fill="#6d28d9">V</text><text x="700" y="292" text-anchor="middle" class="en">Visual Features</text>
  <text x="960" y="190" text-anchor="middle" class="cn">文本解码器</text><text x="960" y="229" text-anchor="middle" class="en">RNN / Transformer</text><text x="960" y="270" text-anchor="middle" font-size="18" fill="#64748b">逐步生成描述</text>
  <text x="1237" y="151" text-anchor="middle" class="cn">图片描述</text>
  <g fill="#fff7ed"><rect x="1134" y="189" width="46" height="42" rx="10"/><rect x="1186" y="189" width="38" height="42" rx="10"/><rect x="1230" y="189" width="38" height="42" rx="10"/><rect x="1274" y="189" width="62" height="42" rx="10"/><rect x="1172" y="241" width="66" height="42" rx="10"/><rect x="1244" y="241" width="66" height="42" rx="10"/></g>
  <text x="1157" y="216" text-anchor="middle" class="token">一只</text><text x="1205" y="216" text-anchor="middle" class="token">狗</text><text x="1249" y="216" text-anchor="middle" class="token">在</text><text x="1305" y="216" text-anchor="middle" class="token">草地</text><text x="1205" y="268" text-anchor="middle" class="token">上</text><text x="1277" y="268" text-anchor="middle" class="token">奔跑</text><text x="1237" y="313" text-anchor="middle" class="en">Caption Tokens</text>
  <text x="960" y="426" text-anchor="middle" font-size="21" font-weight="700">条件输入</text><text x="960" y="455" text-anchor="middle" class="en">起始符 / 已生成词元</text>
  <path class="arrow" d="M285 221 H322"/><path class="arrow" d="M545 221 H582"/><path class="arrow" d="M805 221 H842"/><path class="arrow" d="M1065 221 H1102"/><path class="arrow" d="M960 392 V345"/>
</svg>
