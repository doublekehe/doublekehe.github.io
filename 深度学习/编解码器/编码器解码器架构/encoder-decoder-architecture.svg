<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">编码器-解码器通用流程</title>
  <desc id="desc">输入经过编码器得到中间表示，解码器结合该表示和条件输入生成输出。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L15,8 L1,15 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .cn { font-size: 28px; font-weight: 700; }
      .en { font-size: 18px; font-weight: 600; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="480" rx="28" fill="#f8fafc"/>

  <g filter="url(#shadow)">
    <rect x="45" y="118" width="190" height="138" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="305" y="98" width="220" height="178" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="595" y="118" width="220" height="138" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <rect x="885" y="98" width="220" height="178" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="1175" y="118" width="180" height="138" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="885" y="350" width="220" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <text x="140" y="177" text-anchor="middle" class="cn">输入</text>
  <text x="140" y="213" text-anchor="middle" class="en">Input</text>

  <text x="415" y="169" text-anchor="middle" class="cn">编码器</text>
  <text x="415" y="207" text-anchor="middle" class="en">Encoder</text>

  <text x="705" y="177" text-anchor="middle" class="cn">中间表示</text>
  <text x="705" y="213" text-anchor="middle" class="en">State / Representation</text>

  <text x="995" y="169" text-anchor="middle" class="cn">解码器</text>
  <text x="995" y="207" text-anchor="middle" class="en">Decoder</text>

  <text x="1265" y="177" text-anchor="middle" class="cn">输出</text>
  <text x="1265" y="213" text-anchor="middle" class="en">Output</text>

  <text x="995" y="388" text-anchor="middle" font-size="22" font-weight="700">条件输入</text>
  <text x="995" y="418" text-anchor="middle" class="en">Decoder Input</text>

  <path class="arrow" d="M235 187 H292"/>
  <path class="arrow" d="M525 187 H582"/>
  <path class="arrow" d="M815 187 H872"/>
  <path class="arrow" d="M1105 187 H1162"/>
  <path class="arrow" d="M995 350 V291"/>

  <text x="700" y="315" text-anchor="middle" font-size="18" fill="#64748b">中间表示可以是向量、序列、特征图或概率分布</text>
</svg>
