<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">机器翻译中的编码器-解码器流程</title>
  <desc id="desc">英文词元经编码器转换为语义表示，解码器再生成中文词元。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; } .cn { font-size: 25px; font-weight: 700; }
      .en { font-size: 18px; font-weight: 600; fill: #64748b; } .token { font-size: 19px; font-weight: 650; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="#f8fafc"/>
  <text x="700" y="56" text-anchor="middle" class="title">机器翻译：英文序列 → 中文序列</text>
  <g filter="url(#shadow)">
    <rect x="40" y="132" width="245" height="178" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="335" y="112" width="210" height="218" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="595" y="132" width="210" height="178" rx="20" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <rect x="855" y="112" width="210" height="218" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <rect x="1115" y="132" width="245" height="178" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="855" y="392" width="210" height="82" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="162" y="174" text-anchor="middle" class="cn">英文输入</text>
  <g fill="#eef2ff"><rect x="65" y="205" width="68" height="43" rx="11"/><rect x="141" y="205" width="38" height="43" rx="11"/><rect x="187" y="205" width="74" height="43" rx="11"/></g>
  <text x="99" y="233" text-anchor="middle" class="token">hello</text><text x="160" y="233" text-anchor="middle" class="token">,</text><text x="224" y="233" text-anchor="middle" class="token">world</text>
  <text x="162" y="282" text-anchor="middle" class="en">Input Tokens</text>
  <text x="440" y="196" text-anchor="middle" class="cn">编码器</text><text x="440" y="235" text-anchor="middle" class="en">Encoder</text><text x="440" y="276" text-anchor="middle" font-size="18" fill="#64748b">读取上下文</text>
  <text x="700" y="191" text-anchor="middle" class="cn">语义表示</text><text x="700" y="234" text-anchor="middle" font-size="31" font-weight="700" fill="#6d28d9">V</text><text x="700" y="275" text-anchor="middle" class="en">Context</text>
  <text x="960" y="196" text-anchor="middle" class="cn">解码器</text><text x="960" y="235" text-anchor="middle" class="en">Decoder</text><text x="960" y="276" text-anchor="middle" font-size="18" fill="#64748b">逐步生成</text>
  <text x="1237" y="174" text-anchor="middle" class="cn">中文输出</text>
  <g fill="#fff7ed"><rect x="1142" y="205" width="66" height="43" rx="11"/><rect x="1216" y="205" width="38" height="43" rx="11"/><rect x="1262" y="205" width="66" height="43" rx="11"/></g>
  <text x="1175" y="233" text-anchor="middle" class="token">世界</text><text x="1235" y="233" text-anchor="middle" class="token">，</text><text x="1295" y="233" text-anchor="middle" class="token">你好</text><text x="1237" y="282" text-anchor="middle" class="en">Output Tokens</text>
  <text x="960" y="426" text-anchor="middle" font-size="21" font-weight="700">条件输入</text><text x="960" y="455" text-anchor="middle" class="en">起始符 / 已生成词元</text>
  <path class="arrow" d="M285 221 H322"/><path class="arrow" d="M545 221 H582"/><path class="arrow" d="M805 221 H842"/><path class="arrow" d="M1065 221 H1102"/><path class="arrow" d="M960 392 V345"/>
</svg>
